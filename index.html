<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYMEEE</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{background:radial-gradient(circle at 20% 0,#3b0a4d,#12051c 55%,#07020d);color:#f3e8ff;min-height:100vh;font-family:system-ui,sans-serif;padding-bottom:56px}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.grad{background:linear-gradient(90deg,#ff4ecd,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff4ecd)}
.btn{background:linear-gradient(90deg,#ec4899,#8b5cf6);color:#fff;font-weight:700;border-radius:14px;padding:12px 18px;box-shadow:0 6px 20px rgba(236,72,153,.4);transition:.2s;transform:perspective(400px) translateZ(0)}
.btn:hover{transform:perspective(400px) translateZ(12px)}
.btn.alt{background:rgba(255,255,255,.1);box-shadow:none}
input,textarea,select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;width:100%;color:#fff;outline:none}
select option{color:#000}
.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:14px;margin-top:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.opt.sel{background:linear-gradient(90deg,#ec4899aa,#8b5cf6aa);border-color:#ff4ecd}
.tile{padding:22px;text-align:center;font-weight:800;font-size:1.2rem;cursor:pointer;transition:.25s}
.tile:hover{transform:perspective(500px) rotateX(8deg) translateY(-4px)}
.scr{display:none;max-width:760px;margin:0 auto;padding:16px}.scr.on{display:block}
#intro{position:fixed;inset:0;background:#07020d;z-index:50;transition:opacity .8s}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;font:italic 13px 'Brush Script MT',cursive;color:#c084fcaa;padding:8px;background:linear-gradient(transparent,#07020d)}
.ring{transform:perspective(600px) rotateX(25deg);filter:drop-shadow(0 14px 10px rgba(236,72,153,.5))}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
</style></head><body>
<div id="intro"></div><canvas id="cf"></canvas>
<header class="p-4 text-center"><h1 id="logo" class="text-4xl font-black tracking-widest cursor-pointer select-none"><span class="text-white">SYM</span><span class="grad">EEE</span></h1></header>

<main>
<section id="login" class="scr"><div class="glass p-6 space-y-3">
<h2 class="text-xl font-bold">👋 Welcome Student</h2>
<input id="nm" placeholder="Your Name"><select id="lc"><option>9th</option><option>10th</option><option>11th</option><option>12th</option></select>
<input id="rl" placeholder="Roll No"><button class="btn w-full" onclick="doLogin()">Start →</button></div></section>

<section id="cls" class="scr"><h2 class="text-xl font-bold mb-3">Select Class</h2><div class="grid grid-cols-2 gap-3" id="clsG"></div></section>
<section id="sub" class="scr"><h2 class="text-xl font-bold mb-3">Select Subject</h2><div class="grid grid-cols-1 gap-3" id="subG"></div><button class="btn alt mt-4" onclick="show('cls')">← Back</button></section>
<section id="tl" class="scr"><h2 class="text-xl font-bold mb-3" id="tlh"></h2><div id="tlL" class="space-y-3"></div><button class="btn alt mt-4" onclick="show('sub')">← Back</button></section>

<section id="qz" class="scr"><div class="glass p-5">
<div class="flex justify-between text-sm mb-2"><span id="qn"></span><span id="tm" class="font-bold text-pink-300"></span></div>
<h3 id="qt" class="text-lg font-semibold"></h3><div id="qo"></div>
<div class="flex gap-2 mt-5"><button class="btn alt flex-1" onclick="nav(-1)">◀ Prev</button><button class="btn flex-1" id="nx" onclick="nav(1)">Next ▶</button></div></div></section>

<section id="rs" class="scr"><div class="glass p-5 text-center">
<h2 class="text-2xl font-black"><span class="text-white">SYM</span><span class="grad">EEE</span> Result</h2>
<p id="rinfo" class="text-sm opacity-80 mt-1"></p>
<div class="grid grid-cols-2 gap-2 items-center mt-3">
<div class="ring"><canvas id="dc"></canvas></div>
<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff22" stroke-width="12"/><circle id="pc" cx="60" cy="60" r="50" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)" style="transition:1.5s"/><defs><linearGradient id="g"><stop offset="0" stop-color="#ff4ecd"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><text id="pt" x="60" y="68" text-anchor="middle" fill="#fff" font-size="24" font-weight="800"></text></svg></div></div>
<div id="sc" class="text-xl font-bold mt-3"></div><div id="vd" class="text-lg"></div>
<h3 class="text-left font-bold mt-4 mb-2">🔑 Answer Key</h3><div id="ak" class="text-left space-y-2 text-sm"></div>
<button class="btn w-full mt-4" onclick="show('cls')">Home</button></div></section>

<section id="al" class="scr"><div class="glass p-6 space-y-3"><h2 class="font-bold">🔒 Admin Login</h2>
<input id="ap" type="password" placeholder="Password"><button class="btn w-full" onclick="adminLogin()">Enter</button>
<button class="btn alt w-full" onclick="show('login')">Back</button></div></section>

<section id="ad" class="scr" style="max-width:900px"><div class="glass p-4 mb-3"><h2 class="font-bold">Admin Panel - <span class="text-white">SYM</span><span class="grad">EEE</span> | Managed by Khushbu (Founder)</h2></div>
<div class="glass p-4 space-y-2"><div class="grid grid-cols-2 gap-2"><select id="ac"><option>9th</option><option>10th</option><option>11th</option><option>12th</option></select><select id="as"><option>Chemistry</option><option>Maths</option><option>Science</option></select></div>
<input id="at" placeholder="Quiz Title"><textarea id="ax" rows="10" placeholder="Q: Question? A) opt1 B) opt2* C) opt3 D) opt4 Ans: B&#10;(100 Q paste kar sakte ho)"></textarea>
<div class="flex gap-2"><button class="btn flex-1" onclick="makeQuiz()" id="qb">QUIZ BANAO</button><button class="btn alt" onclick="clearForm()">Clear</button></div></div>
<div class="glass p-4 mt-3"><div class="flex flex-wrap gap-2 mb-3"><button class="btn alt" onclick="exp()">Export JSON</button><label class="btn alt cursor-pointer">Import JSON<input type="file" accept=".json" class="hidden" onchange="imp(event)"></label><button class="btn alt" onclick="show('cls')">Student View</button></div><div id="adL" class="space-y-2"></div></div>
<div class="glass p-4 mt-3 space-y-2"><h3 class="font-bold">☁️ Cloud Sync (Supabase)</h3><p class="text-xs opacity-70">Sirf allowed admin email se. Table: symeee_quizzes</p>
<input id="se" type="email" placeholder="Admin email"><div class="flex gap-2"><button class="btn alt flex-1" onclick="sbSend()">Send Code</button><input id="sk" placeholder="Code" class="flex-1"><button class="btn flex-1" onclick="sbVerify()">Verify</button></div>
<div class="flex gap-2"><button class="btn flex-1" onclick="sbPush()">⬆ Push</button><button class="btn alt flex-1" onclick="sbPull(true)">⬇ Pull</button></div><div id="sm" class="text-xs"></div></div></section>
</main>
<footer>Created by Khushbu | Founder &amp; Educator - SYMEEE Classes</footer>

<script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ADMINS=['rishabh8414p@gmail.com','riyasingh000090pl@gmail.com'];
const SB_URL='https://aydjqwhepicvncwpirle.supabase.co',SB_KEY='sb_publishable_LJsaLbWc0nnDLWlVBw3dXQ_7IYN1GtH';
let sb=null;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S={user:ld('sy_user',null),cls:null,sub:null,quiz:null,ans:[],i:0,t:0,iv:null,edit:null,admin:false};
const SUBS=['Chemistry','Maths','Science'];
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));if(id=='ad')listAdmin();window.scrollTo(0,0)}
const Q=()=>ld('sy_quizzes',[]);

/* 3D intro */
(function(){const el=$('intro'),r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(innerWidth,innerHeight);el.appendChild(r.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);cam.position.z=9;
const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.font='900 190px Arial';x.textAlign='center';x.textBaseline='middle';
x.fillStyle='#fff';x.fillText('SYM',300,130);const g=x.createLinearGradient(520,0,980,0);g.addColorStop(0,'#ff4ecd');g.addColorStop(1,'#a855f7');x.fillStyle=g;x.shadowColor='#ff4ecd';x.shadowBlur=30;x.fillText('EEE',760,130);
const tex=new THREE.CanvasTexture(c),grp=new THREE.Group();
for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:i==13?1:.35,color:i==13?0xffffff:0x8844aa}));m.position.z=i*.07;grp.add(m)}
grp.position.z=-.5;sc.add(grp);
const n=600,pg=new THREE.BufferGeometry(),p=new Float32Array(n*3);for(let i=0;i<n*3;i++)p[i]=(Math.random()-.5)*22;pg.setAttribute('position',new THREE.BufferAttribute(p,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xff4ecd,size:.07}));sc.add(pts);
let t0=performance.now(),run=true;(function a(){if(!run)return;const t=(performance.now()-t0)/1000;grp.rotation.y=Math.sin(t*2)*.6;grp.rotation.x=Math.sin(t*1.3)*.2;pts.rotation.y=t*.4;r.render(sc,cam);requestAnimationFrame(a)})();
setTimeout(()=>{el.style.opacity=0;setTimeout(()=>{run=false;el.remove()},800);show(S.user?'cls':'login')},3000)})();

/* student flow */
function doLogin(){const n=$('nm').value.trim(),rl=$('rl').value.trim();if(!n)return alert('Naam likho');S.user={name:n,cls:$('lc').value,roll:rl};sv('sy_user',S.user);show('cls')}
$('clsG').innerHTML=['9th','10th','11th','12th'].map(c=>`<div class="glass tile" onclick="pickC('${c}')">${c}</div>`).join('');
$('subG').innerHTML=SUBS.map(s=>`<div class="glass tile" onclick="pickS('${s}')">${s}</div>`).join('');
function pickC(c){S.cls=c;show('sub')}
function pickS(s){S.sub=s;const l=Q().filter(q=>q.cls==S.cls&&q.sub==s);$('tlh').textContent=`${S.cls} • ${s}`;
$('tlL').innerHTML=l.length?l.map(q=>`<div class="glass p-4 flex justify-between items-center"><div><b>${E(q.title)}</b><div class="text-xs opacity-70">${q.qs.length} Q • ${q.qs.length} min</div></div><button class="btn" onclick="startQ('${q.id}')">Start</button></div>`).join(''):'<div class="glass p-4">Abhi koi test nahi hai.</div>';show('tl')}
function startQ(id){S.quiz=Q().find(q=>q.id==id);S.ans=new Array(S.quiz.qs.length).fill(-1);S.i=0;S.t=S.quiz.qs.length*60;clearInterval(S.iv);
S.iv=setInterval(()=>{S.t--;tick();if(S.t<=0)submit()},1000);show('qz');draw();tick()}
function tick(){const m=Math.floor(S.t/60),s=S.t%60;$('tm').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`}
function draw(){const q=S.quiz.qs[S.i];$('qn').textContent=`Q ${S.i+1}/${S.quiz.qs.length}`;$('qt').textContent=q.q;
$('qo').innerHTML=q.o.map((o,k)=>`<button class="opt ${S.ans[S.i]==k?'sel':''}" onclick="S.ans[S.i]=${k};draw()">${'ABCD'[k]}) ${E(o)}</button>`).join('');
$('nx').textContent=S.i==S.quiz.qs.length-1?'Submit ✔':'Next ▶'}
function nav(d){if(d>0&&S.i==S.quiz.qs.length-1){if(confirm('Submit karna hai?'))submit();return}S.i=Math.max(0,S.i+d);draw()}
let dch=null;
function submit(){clearInterval(S.iv);const qs=S.quiz.qs;let ok=0,bad=0;qs.forEach((q,i)=>{if(S.ans[i]==q.a)ok++;else if(S.ans[i]>=0)bad++});
const sk=qs.length-ok-bad,pct=Math.round(ok/qs.length*100);
$('rinfo').textContent=`${S.user?.name||''} • ${S.quiz.cls} ${S.quiz.sub} • ${S.quiz.title}`;
$('sc').textContent=`Score: ${ok}/${qs.length} (${pct}%)`;$('vd').textContent=pct>=40?'🎉 Pass! Great job!':'💪 Fail - Try again!';
$('ak').innerHTML=qs.map((q,i)=>{const g=S.ans[i]==q.a;return `<div class="glass p-3"><b>${i+1}. ${E(q.q)}</b><div class="${g?'text-green-300':'text-red-300'}">Your: ${S.ans[i]>=0?'ABCD'[S.ans[i]]+') '+E(q.o[S.ans[i]]):'Skipped'}</div><div class="text-green-300">Correct: ${'ABCD'[q.a]}) ${E(q.o[q.a])}</div></div>`}).join('');
show('rs');if(dch)dch.destroy();
dch=new Chart($('dc'),{type:'doughnut',data:{labels:['Correct','Wrong','Skipped'],datasets:[{data:[ok,bad,sk],backgroundColor:['#a855f7','#ec4899','#475569'],borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{labels:{color:'#fff',boxWidth:10}}}}});
$('pt').textContent=pct+'%';$('pc').style.strokeDashoffset=314;setTimeout(()=>$('pc').style.strokeDashoffset=314-314*pct/100,100);
if(pct>=40)confetti()}
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*4,s:4+Math.random()*6,h:Math.random()*360,r:Math.random()*6}));let f=0;
(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.fillStyle=`hsl(${p.h},90%,60%)`;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(0,0,p.s,p.s*.6);x.restore()});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

/* admin */
let taps=0,tt;$('logo').onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;show(S.admin?'ad':'al')}};
function adminLogin(){if($('ap').value==='symeee123'){S.admin=true;$('ap').value='';show('ad')}else alert('Wrong password')}
function parse(t){const out=[],bl=t.split(/(?:^|\n)\s*Q\s*\d*\s*[:.]/i).map(s=>s.trim()).filter(Boolean);
for(const b of bl){const s=b.replace(/\s+/g,' ');const m=s.match(/^(.*?)\s*\(?A[).]\s*(.*?)\s*\(?B[).]\s*(.*?)\s*\(?C[).]\s*(.*?)\s*\(?D[).]\s*(.*?)(?:\s*Ans(?:wer)?\s*[:\-]\s*\(?([A-D])\)?)?\s*$/i);if(!m)continue;
let o=[m[2],m[3],m[4],m[5]],a=-1;o=o.map((x,i)=>{if(/\*\s*$/.test(x)){a=i;return x.replace(/\s*\*\s*$/,'')}return x});
if(m[6])a='ABCD'.indexOf(m[6].toUpperCase());if(a<0)continue;out.push({q:m[1],o,a})}return out}
function makeQuiz(){const raw=$('ax').value,title=$('at').value.trim()||'Untitled Test',qs=parse(raw);if(!qs.length)return alert('Koi valid question nahi mila. Format check karo.');
const l=Q(),it={id:S.edit||'q'+Date.now(),cls:$('ac').value,sub:$('as').value,title,raw,qs};const k=l.findIndex(x=>x.id==it.id);k>=0?l[k]=it:l.push(it);sv('sy_quizzes',l);alert(`✅ ${qs.length} questions saved!`);clearForm();listAdmin()}
function clearForm(){S.edit=null;$('ax').value='';$('at').value='';$('qb').textContent='QUIZ BANAO'}
function listAdmin(){$('adL').innerHTML=Q().map(q=>`<div class="flex justify-between items-center bg-white/5 rounded-xl p-3"><div><b>${E(q.title)}</b><div class="text-xs opacity-70">${q.cls} • ${q.sub} • ${q.qs.length}Q</div></div><div class="flex gap-2"><button class="btn alt" onclick="ed('${q.id}')">Edit</button><button class="btn alt" onclick="del('${q.id}')">🗑</button></div></div>`).join('')||'<div class="text-sm opacity-70">Koi quiz nahi.</div>'}
function ed(id){const q=Q().find(x=>x.id==id);S.edit=id;$('ac').value=q.cls;$('as').value=q.sub;$('at').value=q.title;$('ax').value=q.raw||q.qs.map(x=>`Q: ${x.q} `+x.o.map((o,i)=>`${'ABCD'[i]}) ${o}${i==x.a?'*':''}`).join(' ')+` Ans: ${'ABCD'[x.a]}`).join('\n');$('qb').textContent='UPDATE QUIZ';window.scrollTo(0,0)}
function del(id){if(confirm('Delete?')){sv('sy_quizzes',Q().filter(x=>x.id!=id));listAdmin()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(Q(),null,1)],{type:'application/json'}));a.download='symeee-quizzes.json';a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;const m=new Map(Q().map(x=>[x.id,x]));d.forEach(x=>x.id&&x.qs&&m.set(x.id,x));sv('sy_quizzes',[...m.values()]);listAdmin();alert('Imported!')}catch(_){alert('Invalid JSON')}};r.readAsText(f)}

/* Supabase (optional cloud sync) */
const msg=t=>$('sm').textContent=t;
async function sbSend(){const e=$('se').value.trim().toLowerCase();if(!ADMINS.includes(e))return msg('Ye email admin list me nahi hai.');const{error}=await sb.auth.signInWithOtp({email:e});msg(error?error.message:'Code email par bheja gaya.')}
async function sbVerify(){const e=$('se').value.trim().toLowerCase();const{error}=await sb.auth.verifyOtp({email:e,token:$('sk').value.trim(),type:'email'});msg(error?error.message:'✅ Logged in: '+e)}
async function sbPush(){try{const{data:{session}}=await sb.auth.getSession();if(!session||!ADMINS.includes(session.user.email))return msg('Pehle admin email se verify karo.');
const rows=Q().map(q=>({id:q.id,data:q}));const{error}=await sb.from('symeee_quizzes').upsert(rows);msg(error?error.message:`⬆ ${rows.length} quizzes pushed`)}catch(e){msg('Error: '+e.message)}}
async function sbPull(manual){try{const{data,error}=await sb.from('symeee_quizzes').select('id,data');if(error)throw error;if(!data||!data.length)return manual&&msg('Cloud khali hai.');
const m=new Map(Q().map(x=>[x.id,x]));data.forEach(r=>m.set(r.id,r.data));sv('sy_quizzes',[...m.values()]);manual&&(msg(`⬇ ${data.length} quizzes pulled`),listAdmin())}catch(e){manual&&msg('Error: '+e.message)}}
if(sb)sbPull(false);
</script></body></html>
